name: build

# Build muEye across the target platforms:
#   * Linux   — x86_64 and ARM64
#   * Windows — x86_64 and ARM64
#   * macOS   — ARM64 (Apple Silicon)
#
# muEye consumes muGrid via add_subdirectory, so each job checks out muGrid
# alongside it. Dependencies: NetCDF (system on Linux/macOS, vcpkg on Windows),
# OpenGL, plus GLFW + Dear ImGui which the build fetches automatically.
#
# Every job also packages a self-contained binary (all non-system shared
# libraries bundled) and uploads it as a workflow artifact:
#   * Linux   — muEye-<ver>-linux-<arch>.AppImage  (linuxdeploy)
#   * macOS   — muEye-<ver>-macos-arm64.zip         (.app, dylibbundler, ad-hoc signed)
#   * Windows — muEye-<ver>-windows-<arch>.zip      (exe + vcpkg DLLs + MSVC runtime)
# Pushing a tag v* additionally publishes these as a GitHub release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # muGrid dependency. Pin MUGRID_REF to a tag (e.g. "0.110.0") for reproducible
  # builds; "main" tracks the latest.
  MUGRID_REPO: muSpectre/muGrid
  MUGRID_REF: main

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   runner: ubuntu-24.04,     os: linux,   triplet: "" }
          - { name: linux-arm64,    runner: ubuntu-24.04-arm, os: linux,   triplet: "" }
          - { name: macos-arm64,    runner: macos-14,         os: macos,   triplet: "" }
          - { name: windows-x86_64, runner: windows-latest,   os: windows, triplet: x64-windows }
          - { name: windows-arm64,  runner: windows-11-arm,   os: windows, triplet: arm64-windows }

    steps:
      - name: Checkout muEye
        uses: actions/checkout@v5
        with:
          path: muEye

      - name: Checkout muGrid (dependency)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.MUGRID_REPO }}
          ref: ${{ env.MUGRID_REF }}
          path: muGrid

      # ------------------------------------------------------------------ deps
      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libnetcdf-dev libgl1-mesa-dev libglu1-mesa-dev xorg-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: brew install netcdf pkg-config ninja dylibbundler

      - name: Export vcpkg GitHub Actions cache variables (Windows)
        if: matrix.os == 'windows'
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # ------------------------------------------------------------- configure
      - name: Configure (Linux / macOS)
        if: matrix.os != 'windows'
        run: >
          cmake -S muEye -B muEye/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMUEYE_MUGRID_SOURCE_DIR=${{ github.workspace }}/muGrid

      - name: Configure (Windows)
        if: matrix.os == 'windows'
        # vcpkg (manifest mode) provides NetCDF; binaries are cached in the
        # GitHub Actions cache to speed up subsequent runs.
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: >
          cmake -S muEye -B muEye/build
          -DCMAKE_BUILD_TYPE=Release
          -DMUEYE_MUGRID_SOURCE_DIR=${{ github.workspace }}/muGrid
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      # ----------------------------------------------------------------- build
      - name: Build muEye
        run: cmake --build muEye/build --config Release --parallel

      # Headless smoke test: writes a demo .nc via muGrid, reads it back and
      # ray-traces offscreen (no display needed). Skipped on Windows to avoid
      # runtime DLL-path setup for the vcpkg NetCDF/HDF5 libraries.
      - name: Smoke test (Linux / macOS)
        if: matrix.os != 'windows'
        run: |
          cmake --build muEye/build --target muEye_check --parallel
          (cd muEye/build && ./muEye_check demo.nc 32)

      # --------------------------------------------------------------- package
      - name: Set package name
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="$GITHUB_REF_NAME"
          else
            ver="$(git -C muEye rev-parse --short HEAD)"
          fi
          echo "PKG=muEye-${ver}-${{ matrix.name }}" >> "$GITHUB_ENV"
          mkdir -p dist

      - name: Package AppImage (Linux)
        if: matrix.os == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1   # runners have no FUSE to mount AppImages
        run: |
          curl -fsSL -o linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$(uname -m).AppImage"
          chmod +x linuxdeploy
          DESTDIR="$PWD/AppDir" cmake --install muEye/build --component viewer --prefix /usr
          install -Dm644 muEye/LICENSE AppDir/usr/share/doc/muEye/LICENSE
          # Bundles every shared library except the ones on the AppImage
          # excludelist (glibc, libGL, X11, ...), which must come from the host.
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/muEye \
            --desktop-file muEye/resources/muEye.desktop \
            --icon-file muEye/resources/muEye.png \
            --output appimage
          mv muEye*.AppImage "dist/$PKG.AppImage"

      - name: Package .app (macOS)
        if: matrix.os == 'macos'
        run: |
          cmake --install muEye/build --component viewer --prefix stage
          app=stage/muEye.app
          # Copy the Homebrew dylibs (NetCDF, HDF5, ...) into the bundle and
          # rewrite their install names to @executable_path/../Frameworks.
          dylibbundler --overwrite-dir --bundle-deps --create-dir \
            --fix-file "$app/Contents/MacOS/muEye" \
            --dest-dir "$app/Contents/Frameworks" \
            --install-path @executable_path/../Frameworks/
          # install_name_tool invalidates signatures and Apple Silicon refuses
          # to run unsigned code, so re-sign the whole bundle ad hoc.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          # Fail if anything still references a non-system library.
          leaks=$(otool -L "$app"/Contents/MacOS/muEye "$app"/Contents/Frameworks/*.dylib \
                  | awk '/^\t/ && $1 !~ /^(@|\/usr\/lib\/|\/System\/)/')
          if [ -n "$leaks" ]; then echo "Unbundled libraries:"; echo "$leaks"; exit 1; fi
          cp muEye/LICENSE stage/
          ditto -c -k stage "dist/$PKG.zip"

      - name: Package zip (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # Installs muEye.exe plus the MSVC runtime (InstallRequiredSystemLibraries).
          cmake --install muEye/build --config Release --component viewer --prefix stage
          # vcpkg's applocal step copied NetCDF/HDF5/... next to the built exe.
          Copy-Item muEye/build/Release/*.dll stage/
          if (-not (Test-Path stage/netcdf.dll)) { throw "netcdf.dll was not bundled" }
          Copy-Item muEye/LICENSE stage/
          Compress-Archive -Path stage/* -DestinationPath "dist/$env:PKG.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: dist/*
          if-no-files-found: error

  # Publish the packages of a v* tag as a GitHub release. Runs only once every
  # platform built and packaged successfully.
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "muEye $GITHUB_REF_NAME"
          --generate-notes --verify-tag
