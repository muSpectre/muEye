name: GPU build

# Compile + link check for the HIP backend, which the main build.yml matrix
# does not cover (its runners have no ROCm toolchain). The job does not run the
# binary — a GPU is only needed to execute, not to build — so it uses an
# ordinary GitHub-hosted runner in a ROCm container and just verifies that the
# shared GpuRenderer.cc compiles and links against HIP. (CUDA is built by
# build.yml itself: its x86_64 Linux and Windows packages ship the CUDA backend.)
#
# muEye consumes muGrid via add_subdirectory, so the job checks out muGrid
# alongside it. muGrid itself is built CPU-only here — muEye only needs its
# host-callable gpu_runtime.hh header for the HIP path; the ray-march kernels
# are muEye's own.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MUGRID_REPO: muSpectre/muGrid
  MUGRID_REF: main

jobs:
  hip:
    name: hip (compile check)
    runs-on: ubuntu-24.04
    container: rocm/dev-ubuntu-24.04:6.2.4
    timeout-minutes: 60
    steps:
      - name: Checkout muEye
        uses: actions/checkout@v5
        with:
          path: muEye

      - name: Checkout muGrid (dependency)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.MUGRID_REPO }}
          ref: ${{ env.MUGRID_REF }}
          path: muGrid

      - name: Install build dependencies
        run: |
          apt-get update -qy
          apt-get install -y --no-install-recommends \
            cmake ninja-build git ca-certificates \
            libnetcdf-dev libgl1-mesa-dev xorg-dev

      - name: Show HIP info
        run: hipcc --version

      # No AMD GPU on this runner: compile + link only, never launched. gfx90a
      # (MI200) is a representative device target.
      - name: Configure (HIP)
        run: >
          cmake -S muEye -B muEye/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMUEYE_MUGRID_SOURCE_DIR=$GITHUB_WORKSPACE/muGrid
          -DMUEYE_ENABLE_HIP=ON
          -DCMAKE_HIP_ARCHITECTURES=gfx90a

      - name: Build offscreen check (compile + link only)
        run: cmake --build muEye/build --target muEye_check --parallel
